# RCA Price Adjustments — Vanity Test
# Upload: python create_price_adjustments.py --catalog rca_adjustments.yaml --org myorg

price_adjustment_schedules:

  # 1. Volume discount — buy more Vanity bundles, save more
  - name: "Vanity Volume Discount"
    schedule_type: "Volume"
    adjustment_method: "Range"
    is_active: true
    pricebook: "Standard Price Book"
    tiers:
      - lower_bound: 2
        upper_bound: 4
        tier_type: "AdjustmentPercentage"
        tier_value: 5
        product_code: "BUNDLE-VAN-001"
        psm_name: "One-Time"
      - lower_bound: 5
        upper_bound: null          # open-ended
        tier_type: "AdjustmentPercentage"
        tier_value: 10
        product_code: "BUNDLE-VAN-001"
        psm_name: "One-Time"

  # 2. Bundle discount — Quartz gets 15% off when it appears inside the Vanity bundle
  - name: "Vanity Bundle Component Discount"
    schedule_type: "Bundle"
    adjustment_method: "Range"
    is_active: true
    pricebook: "Standard Price Book"
    bundle_adjustments:
      - product_code: "QTZ-001"
        psm_name: "One-Time"
        parent_product_code: "BUNDLE-VAN-001"
        parent_psm_name: "One-Time"
        adjustment_type: "Percentage"
        adjustment_value: 15

  # 3. Attribute-based — Quartz countertop selection triggers a 10% upcharge on the bundle
  - name: "Vanity Countertop Material Pricing"
    schedule_type: "Attribute"
    adjustment_method: "Range"
    is_active: true
    pricebook: "Standard Price Book"
    attribute_adjustments:
      - rule_name: "Vanity Quartz Upcharge"
        usage_type: "Pricing"
        conditions:
          - attribute: "Countertop Material"
            product_code: "BUNDLE-VAN-001"
            operator: "equals"
            value: "Quartz"
        adjustment:
          product_code: "BUNDLE-VAN-001"
          psm_name: "One-Time"
          adjustment_type: "Percentage"
          adjustment_value: 10
